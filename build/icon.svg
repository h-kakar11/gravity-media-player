<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3150"/>
      <stop offset="1" stop-color="#0d0f1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="52%">
      <stop offset="0" stop-color="#4a93ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4a93ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="36%" cy="30%" r="78%">
